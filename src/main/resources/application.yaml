spring:

  application:
    name: tenatos-registrar

  #DATABASE CONFIGURATION
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: tenantos-registrar-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      connection-test-query: SELECT 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  #SQL DATABASE INITIALIZATION
  sql:
    init:
      mode: never

  #FLYWAY
  flyway:
    enabled: false
    locations:
      - classpath:db/migration
    baselineOnMigrate: true
    cleanDisabled: false

  #MAIL
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  #THYMELEAF
  thymeleaf:
    prefix: classpath:/email/templates/

#FRONTEND APP REGISTRATION CONFIGURATION
fe:
  onboarding:
    session-token-cookie-name: ${ONBOARDING_TOKEN_COOKIE_NAME:onboarding_token}
    token-ttl-seconds: ${ONBOARDING_TOKEN_TTL_SECONDS:3600}
    otp-ttl-seconds: ${ONBOARDING_OTP_TTL_SECONDS:600}
    otp-max-attempts: ${ONBOARDING_OTP_MAX_ATTEMPTS:5}
    otp-generation-max-count: ${ONBOARDING_OTP_GENERATION_MAX_COUNT:3}
    otp-generation-window-seconds: ${ONBOARDING_OTP_GENERATION_WINDOW_SECONDS:3600}
    otp-from-address: ${ONBOARDING_OTP_FROM_ADDRESS:no-reply@tenantos.local}
    verify-url-template: ${ONBOARDING_VERIFY_URL_TEMPLATE:http://localhost:3000/onboarding/verify?email={email}&vrfk={vrfk}}
    login-url: ${ONBOARDING_LOGIN_URL:http://localhost:3000/login}

#BACKGROUND TENANT WORKSPACE PROVISIONING
workspace:
  provisioning:
    # Kubernetes access comes from KubernetesClientFactory's auto-configuration (KUBECONFIG env
    # var, ~/.kube/config, or the in-cluster service account) - no property here controls it.
    enabled: ${WORKSPACE_PROVISIONING_ENABLED:true}
    poll-interval-ms: ${WORKSPACE_PROVISIONING_POLL_INTERVAL_MS:5000}
    initial-delay-ms: ${WORKSPACE_PROVISIONING_INITIAL_DELAY_MS:15000}
    batch-size: ${WORKSPACE_PROVISIONING_BATCH_SIZE:10}
    max-attempts: ${WORKSPACE_PROVISIONING_MAX_ATTEMPTS:5}
    backoff-seconds: ${WORKSPACE_PROVISIONING_BACKOFF_SECONDS:30}
    max-backoff-seconds: ${WORKSPACE_PROVISIONING_MAX_BACKOFF_SECONDS:900}
    # How long a claimed job may stay IN_PROGRESS before another worker assumes the claimant died
    # and re-claims it. Must comfortably exceed a worst-case provisioning call.
    lease-seconds: ${WORKSPACE_PROVISIONING_LEASE_SECONDS:600}

#TENANT PROVISIONING + TENANT-AWARE AUTH
tenant:
  provisioning:
    default-plan: ${TENANT_DEFAULT_PLAN:FREE_TRIAL}
    trial-days: ${TENANT_TRIAL_DAYS:14}
    trial-limits: ${TENANT_TRIAL_LIMITS:{"seats":5,"apiCallsPerMonth":100000,"storageGb":5}}
  #PER-TENANT DATABASE (CREATE_TENANT_DATABASE step)
  database:
    # Off switches the step into a log-and-advance no-op. Without it, any environment with no
    # tenant-data server would dead-letter every job here - the same lesson as
    # workspace.provisioning.enabled above.
    enabled: ${TENANT_DATABASE_ENABLED:true}
    # The tenant-data server, deliberately not spring.datasource: tenant data and the control plane
    # belong in separate blast radii. Locally this is the tenant-postgres container on 54323.
    # The admin role needs only CREATEDB and CREATEROLE, not superuser.
    admin-url: ${TENANT_DB_ADMIN_URL}
    admin-user: ${TENANT_DB_ADMIN_USER}
    admin-password: ${TENANT_DB_ADMIN_PASSWORD}
    # What gets published to the tenant - what their workloads dial, which is not necessarily how
    # the registrar reached the server above. In-cluster pods resolve a service name; the registrar
    # may come via a bastion or a different DNS name entirely.
    host: ${TENANT_DB_HOST}
    port: ${TENANT_DB_PORT}
    # Per-role cap, so one tenant cannot exhaust the server's max_connections on its own.
    connection-limit: ${TENANT_DB_CONNECTION_LIMIT:20}
    secret:
      kubernetes-enabled: ${TENANT_DB_K8S_SECRET_ENABLED:false}
      name-prefix: ${TENANT_DB_SECRET_PREFIX}
      kubernetes-name: ${TENANT_DB_K8S_SECRET_NAME}
  #PER-TENANT APP DEPLOYMENT (DISPATCH_TENANT_DEPLOY / AWAIT_TENANT_DEPLOY steps)
  deploy:
    # Off by default: both steps log and advance instead of dead-lettering every tenant in an
    # environment with no Forgejo wired up.
    enabled: ${TENANT_DEPLOY_ENABLED:false}
    # Which skaffolder environment (dev, staging, prod) tenant apps are rendered for.
    environment: ${TENANT_DEPLOY_ENV:dev}
    # Full image refs deployed for every new tenant. Pin these to the tag promoted for the
    # environment; a mutable tag like :latest makes a tenant's first deploy non-reproducible.
    backend-image: ${TENANT_DEPLOY_BACKEND_IMAGE:}
    ui-image: ${TENANT_DEPLOY_UI_IMAGE:}
    # Shared Redis for tenant backends, mirrored into each tenant's Infisical folder. Blank skips it.
    redis-url: ${TENANT_DEPLOY_REDIS_URL:}
    # Must stay well under workspace.provisioning.lease-seconds, or another worker re-claims the
    # job while this one is still waiting.
    await-timeout-seconds: ${TENANT_DEPLOY_AWAIT_TIMEOUT_SECONDS:240}
    poll-interval-seconds: ${TENANT_DEPLOY_POLL_INTERVAL_SECONDS:5}
    forgejo:
      api-url: ${FORGEJO_API_URL:}
      # Needs write access to Actions on the repository below.
      token: ${FORGEJO_DISPATCH_TOKEN:}
      # The repository holding .forgejo/workflows/tenant-deploy_v1.yml.
      repository: ${TENANT_DEPLOY_REPOSITORY:Homelab/tenantos-registrar}
      workflow: ${TENANT_DEPLOY_WORKFLOW:tenant-deploy_v1.yml}
      ref: ${TENANT_DEPLOY_REF:main}
  auth:
    # Short-lived by design: the access token cannot be revoked once signed, so its blast radius
    # is bounded by its lifetime. Revocation works through the session row the token names.
    access-token-ttl-seconds: ${TENANT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${TENANT_REFRESH_TOKEN_TTL_SECONDS:2592000}
    session-ttl-seconds: ${TENANT_SESSION_TTL_SECONDS:2592000}
    refresh-cookie-name: ${TENANT_REFRESH_COOKIE_NAME:tenant_refresh_token}

#INFISICAL (PROVISION_INFISICAL_SECRETS step)
infisical:
  # Off by default: with no Infisical configured the step logs and advances instead of
  # dead-lettering every tenant.
  enabled: ${INFISICAL_ENABLED:false}
  api-url: ${INFISICAL_API_URL:}
  # Universal Auth machine identity. Needs create on folders and secrets in the project.
  client-id: ${INFISICAL_CLIENT_ID:}
  client-secret: ${INFISICAL_CLIENT_SECRET:}
  project-id: ${INFISICAL_PROJECT_ID:}
  # Every environment listed gets the same folders and secrets.
  environments: ${INFISICAL_ENVIRONMENTS:dev,staging,prod}
  # Each tenant gets /<slug>/backend. The database step writes TENANT_* there; this step seeds the
  # extra keys below (comma-separated) for a person to fill in.
  # Created only when missing and never overwritten, so values filled in later survive retries.
  secrets:
    placeholder: ${INFISICAL_SECRET_PLACEHOLDER:CHANGE_ME}
    backend-keys: ${INFISICAL_BACKEND_SECRET_KEYS:JWT_SECRET}

logging:
  level:
    # Everything this service logs itself: onboarding funnel, provisioning pipeline, tenant auth.
    # All levels are env-overridable so deployed environments can dial them back without editing
    # this file.
    com.tenantos.registrar: ${LOG_LEVEL_APP:TRACE}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.flywaydb: ${LOG_LEVEL_FLYWAY:DEBUG}

#SECURITY CONFIGURATION
security:
  jwt:
    # Blank generates an ephemeral per-process key - fine locally, but tokens then die at restart
    # and are rejected by other replicas. Must be set before running more than one instance.
    secret: ${TENANTS_AUTH_JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
    max-age: ${CORS_MAX_AGE:3600}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}


#RATE LIMITING CONFIGURATION
ratelimit:
  config:
    onboarding:
      path: "/onboarding"
      maxRequests: ${RATE_LIMIT_ONBOARDING_MAX_REQUESTS:60}
      windowSeconds: ${RATE_LIMIT_ONBOARDING_WINDOW_SECONDS:60}
      enabled: ${RATE_LIMIT_ONBOARDING_ENABLED:true}

server:
  port: ${PORT}

