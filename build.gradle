buildscript {
    dependencies {
        classpath 'org.flywaydb:flyway-database-postgresql:13.0.0'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '13.0.0'
}

group = 'com.tenantos.registrar'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


ext {
    awsSdkVersion = '2.49.4'
}

dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
    }
}

dependencies {
    //Springboot dependencies
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

    // JWT library (JJWT)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    //Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //Flyway
    implementation "org.springframework.boot:spring-boot-starter-flyway:4.0.1"
    implementation "org.flywaydb:flyway-database-postgresql"

    //PostgresSQL
    runtimeOnly 'org.postgresql:postgresql'

    //AWS SDK v2 - credential resolution (env vars, EC2/ECS instance profile, EKS pod/IRSA web identity)
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:regions'
    implementation 'software.amazon.awssdk:sts'

    //AWS SDK v2 - EKS cluster discovery + IAM-based Kubernetes API authentication
    implementation 'software.amazon.awssdk:eks'
    implementation 'software.amazon.awssdk:http-auth-aws'

    //AWS SDK v2 - system of record for per-tenant database credentials
    implementation 'software.amazon.awssdk:secretsmanager'

    //Kubernetes client - talks to the EKS control plane using EksClusterAuthProvider's token
    implementation 'io.fabric8:kubernetes-client:7.8.0'

    //Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

// Read from system environment or fallback to local defaults for convenience
def dbUrl = System.getenv('DB_URL') ?: "jdbc:postgresql://localhost:54321/${System.getenv('DB_NAME') ?: 'tenantos_registrar'}"
def dbUser = System.getenv('POSTGRES_USER') ?: 'tenantos-master'
def dbPassword = System.getenv('POSTGRES_PASSWORD') ?: 'c4rl0sP@ssw0rds'

flyway {
    url = dbUrl
    user = dbUser
    password = dbPassword
    locations = ['classpath:db/migration']
    baselineOnMigrate = true
    cleanDisabled = true
    // flywayClean drops the whole schema; keep it opt-in only
}

tasks.named('test') {
    useJUnitPlatform()
}
