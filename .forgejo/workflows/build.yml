name: Build and Deploy

# Shown in the run list instead of the static name above. Needs a Forgejo version that supports run-name.
# The `env` context is unavailable here, so the app name is literal; Kargo deploy dispatches add the env.
run-name: Build and Deploy - tenantos-registrar${{ inputs.image != '' && format(' ({0})', inputs.env) || '' }}

# Pushes build the image and push it to the Forgejo registry; Kargo then picks up
# the new tag and promotes it dev -> qa -> prod by dispatching this workflow with
# `env` and `image`, which runs only the deploy job.
on:
  push:
    # Only main: every pushed SHA tag is picked up by the Kargo Warehouse and
    # auto-promoted to dev, so feature branches must not publish one.
    branches:
      - main
    tags:
      - "v*"
  # Kargo promotions dispatch this with `env` + `image`: deploy only, no build.
  # Dispatching without `image` just builds.
  workflow_dispatch:
    inputs:
      env:
        description: Environment to deploy to (dev, qa, prod)
        required: false
        default: dev
      image:
        description: Full image ref to deploy (skips the build)
        required: false
        default: ""

env:
  # --- Registry / image -------------------------------------------------------
  PROJECT_NAME: tenantos-registrar
  PROJECT_SCHEMA: java21
  REGISTRY: ${{vars.REGISTRY_HOST_NAME}}
  # `env` context is unavailable in workflow-level env, so the name is literal.
  IMAGE_NAME: homelab/tenantos-registrar
  JDK_VERSION: "21-jdk-alpine"
  JRE_VERSION: "21-jre-alpine"
  
  # Repo holding skaffolder's schemas/ (manifest templates) and configs/ (per-project values).
  CONFIGS_REPO: Homelab/skaffolder-configs.git

  # --- Kubernetes --------------------------------------------------------------
  DEPLOY_ENV: ${{ inputs.env || 'dev' }}
  KUBE_NAMESPACE: tenant-apps-${{ env.DEPLOY_ENV }}

  #Infisical
  INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL }}
  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}

jobs:
  build-and-push:
    name: Build and push image
    if: ${{ inputs.image == '' }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          # <UTC timestamp>-<sha12>: sortable, so the Kargo Warehouse (Lexical) can
          # tell which build is newest. Plain SHA tags have no order, and CI-only
          # commits rebuild an identical image, so NewestBuild can't tell either.
          SHA_TAG="$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::12}"
          IMAGE="${REGISTRY}/${IMAGE_NAME}"

          TAGS="${IMAGE}:${SHA_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi

          echo "image-tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${IMAGE}:${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            JDK_VERSION=${{ env.JDK_VERSION }}
            JRE_VERSION=${{ env.JRE_VERSION }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  manifests:
    name: Generate manifests
    needs: build-and-push
    # Only Kargo-style dispatches deploy; build-and-push is skipped then, hence always().
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.image != '' }}
    runs-on: ubuntu-latest
    steps:
      # Must live in this job: `needs.*` only resolves here, and GITHUB_ENV is
      # scoped to the job that writes it.
      - name: Set build vars
        env:
          IMAGE_REF: ${{ inputs.image || needs.build-and-push.outputs.image-ref }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_REF}" ]; then
            echo "::error::build-and-push produced an empty image-ref"
            exit 1
          fi
          echo "BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

          # The image tag is <timestamp>-<12-char commit SHA>; the SHA is the commit it was built from, which is
          # not necessarily the ref this run was dispatched on.
          IMAGE_TAG="${IMAGE_REF##*:}"
          COMMIT_SHA="${IMAGE_TAG##*-}"
          echo "COMMIT_SHA=${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${COMMIT_SHA::7}" >> "$GITHUB_ENV"
          # Link to the commit the image was built from (not the dispatched ref).
          echo "REPO_COMMIT_REF=https://${REGISTRY}/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_ENV"
          echo "APP_IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"

      # COMMIT_SHA (set above) is the commit the image was built from, not the dispatched ref, so the
      # RBAC shipped matches the image being deployed. It is only the 12-char prefix from the image
      # tag, and actions/checkout treats `ref` as a branch/tag name (a short SHA matches nothing), so
      # fetch history (cheap: sparse + blob-less) and let git resolve the prefix.
      - name: Checkout k8s manifests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: k8s
          path: source

      - name: Pin k8s manifests to the image's commit
        run: |
          set -euo pipefail
          git -C source checkout --detach "${COMMIT_SHA}"
          ls source/k8s

      # ci-actions is private, which the runner cannot clone on its own, so it is checked out with a
      # token and used as local actions. Pinned to a tag.
      - name: Checkout shared actions
        uses: actions/checkout@v4
        with:
          repository: Homelab/ci-actions
          ref: v2
          token: ${{ secrets.ACTIONS_TOKEN }}
          path: ci-actions
          persist-credentials: false

      - uses: ./ci-actions/setup-skaffolder
        with:
          npm-registry-host: ${{ vars.NPM_REGISTRY_HOST }}
          npm-token: ${{ secrets.SKAFFOLDER_FORGEJO_TOKEN }}
          registry-host: ${{ env.REGISTRY }}
          configs-repo: ${{ env.CONFIGS_REPO }}
          configs-token: ${{ secrets.ACTIONS_TOKEN }}

      - uses: ./ci-actions/setup-skaffold

      - uses: ./ci-actions/render-manifests
        with:
          name: ${{ env.PROJECT_NAME }}
          env: ${{ env.DEPLOY_ENV }}
          schema: ${{ env.PROJECT_SCHEMA }}
          namespace: ${{ env.KUBE_NAMESPACE }}

      # manifest.yaml embeds the secrets skaffolder pulled from Infisical as plain
      # env values. Artifacts are readable by anyone with repo access, so encrypt.
      - uses: ./ci-actions/encrypt-bundle
        with:
          key: ${{ secrets.MANIFEST_ENCRYPTION_KEY }}
          extra-directory: ${{ github.workspace }}/source
          extra-files: k8s

      - name: Upload rendered bundle
        uses: actions/upload-artifact@v3
        with:
          name: rendered-bundle
          path: bundle.enc
          retention-days: 1

  deploy:
    name: Deploy to Kubernetes
    needs: manifests
    runs-on: ubuntu-latest
    # Two promotions to the same env must not apply at the same time.
    concurrency:
      group: deploy-${{ inputs.env || 'dev' }}
      cancel-in-progress: false
    steps:
      # ci-actions is private, which the runner cannot clone on its own, so it is checked out with a
      # token and used as local actions. Pinned to a tag.
      - name: Checkout shared actions
        uses: actions/checkout@v4
        with:
          repository: Homelab/ci-actions
          ref: v2
          token: ${{ secrets.ACTIONS_TOKEN }}
          path: ci-actions
          persist-credentials: false

      - name: Download rendered bundle
        uses: actions/download-artifact@v3
        with:
          name: rendered-bundle

      - uses: ./ci-actions/decrypt-bundle
        with:
          key: ${{ secrets.MANIFEST_ENCRYPTION_KEY }}
          expect: manifest.yaml skaffold.yaml k8s/rbac.yaml

      - uses: ./ci-actions/setup-skaffold

      - uses: ./ci-actions/setup-kubectl

      - uses: ./ci-actions/setup-kubeconfig
        with:
          kubeconfig-b64: ${{ secrets.KUBECONFIG_B64 }}

      # No migration step: Flyway runs via the `migration` Spring profile, not from the pipeline.
      - name: Apply manifest with skaffold
        run: |
          set -euo pipefail
          skaffold apply --kubeconfig="$HOME/.kube/config" \
            --profile="${DEPLOY_ENV}" --namespace ${{env.KUBE_NAMESPACE}} --filename=skaffold.yaml manifest.yaml

      # Not part of the skaffolder schema, so it is applied here. `kubectl apply` is idempotent: after
      # the first run it is a no-op unless k8s/rbac.yaml changed, so it needs no "already done" guard.
      # The kubeconfig user must be allowed to create ClusterRoles/Bindings (and, because Kubernetes
      # blocks privilege escalation, to hold every permission it grants).
      - name: Apply registrar RBAC
        run: |
          set -euo pipefail
          ls
          # The manifest binds to tenant-apps-dev; point it at this environment's namespace.
          sed "s/namespace: tenant-apps-dev/namespace: ${KUBE_NAMESPACE}/" k8s/rbac.yaml \
            | kubectl --kubeconfig="$HOME/.kube/config" apply -f -
